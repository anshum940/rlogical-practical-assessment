name: DevOps Practical CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Push the scanned image to ECR and deploy it to EC2
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-quality:
    name: Test and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-3-docker/package-lock.json

      - name: Install dependencies
        working-directory: task-3-docker
        run: npm ci

      - name: Run tests
        working-directory: task-3-docker
        run: npm test

      - name: Detect SonarQube configuration
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [[ -n "${SONAR_TOKEN}" && -n "${SONAR_HOST_URL}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Require SonarQube for a deployment run
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && steps.sonar-config.outputs.enabled != 'true'
        run: |
          echo "SONAR_TOKEN and SONAR_HOST_URL are required when deploy=true." >&2
          exit 1

      - name: Run SonarQube analysis
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: task-3-docker

      - name: Explain skipped SonarQube analysis
        if: steps.sonar-config.outputs.enabled != 'true'
        run: echo "SonarQube analysis skipped because the repository has no configured SONAR_TOKEN and/or SONAR_HOST_URL."

  build-scan-push:
    name: Build, scan, and optionally push
    needs: test-and-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build image
        run: docker build --pull --tag "devops-practical-app:${GITHUB_SHA}" task-3-docker

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-practical-app:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          format: table
          exit-code: "1"
          version: v0.74.0

      - name: Validate deployment configuration
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          missing=0
          for variable_name in AWS_ROLE_TO_ASSUME AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required repository variable: ${variable_name}" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure AWS credentials with OIDC
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Tag and push image
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        id: publish
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "devops-practical-app:${GITHUB_SHA}" "${image_uri}"
          docker push "${image_uri}"
          echo "image_uri=${image_uri}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy and verify
    needs: build-scan-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: devops-practical-production-${{ vars.EC2_INSTANCE_ID }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment command through Systems Manager
        id: send-command
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ needs.build-scan-push.outputs.ecr_registry }}
          IMAGE_URI: ${{ needs.build-scan-push.outputs.image_uri }}
        run: |
          set -Eeuo pipefail
          parameters_file="${RUNNER_TEMP}/ssm-parameters.json"

          jq -n \
            --arg image_uri "${IMAGE_URI}" \
            --arg registry "${ECR_REGISTRY}" \
            --arg region "${AWS_REGION}" \
            '{
              commands: [
                "set -Eeuo pipefail",
                ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
                ("docker pull " + ($image_uri | @sh)),
                "docker rm --force devops-practical-app >/dev/null 2>&1 || true",
                ("docker run --detach --name devops-practical-app --restart unless-stopped --publish 3000:3000 " + ($image_uri | @sh)),
                "for attempt in $(seq 1 20); do if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then exit 0; fi; sleep 3; done; docker logs --tail 100 devops-practical-app; exit 1"
              ]
            }' > "${parameters_file}"

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --comment "Deploy commit ${GITHUB_SHA}" \
            --parameters "file://${parameters_file}" \
            --region "${AWS_REGION}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for deployment and health check
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          set +e
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}"
          wait_exit=$?
          set -e

          status="$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query Status \
            --output text)"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [[ "${wait_exit}" -ne 0 || "${status}" != "Success" ]]; then
            exit 1
          fi
